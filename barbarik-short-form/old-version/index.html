<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barbarik / Khatu Shyam - Short</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@600;800&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #stage { position:relative; width:540px; height:960px; transform-origin:center; overflow:hidden; background:#0b0a10;
           font-family:'Mukta','Noto Sans Devanagari','Nirmala UI','Mangal',sans-serif; }
  .scene { position:absolute; inset:0; opacity:0; transform-origin:50% 45%; will-change:transform,opacity; }
  .scene svg { position:absolute; inset:0; width:540px; height:960px; }
  canvas { position:absolute; inset:0; pointer-events:none; z-index:5; }
  #shade { z-index:6 } #vig { z-index:7 } #caption { z-index:8 } #bar { z-index:9 }
  svg text { font-family:'Mukta','Noto Sans Devanagari','Nirmala UI','Mangal',sans-serif; }

  @keyframes pulse  { 0%,100%{opacity:.55} 50%{opacity:1} }
  @keyframes float  { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  @keyframes bob    { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
  @keyframes spin   { to{transform:rotate(360deg)} }
  @keyframes spinr  { to{transform:rotate(-360deg)} }
  @keyframes wave   { 0%,100%{transform:skewY(-5deg)} 50%{transform:skewY(6deg)} }
  @keyframes pop    { 0%{opacity:0; transform:translateY(34px) scale(.85)} 100%{opacity:1; transform:none} }
  @keyframes flick  { 0%,100%{opacity:.95} 50%{opacity:.5} }
  @keyframes riseUp { from{transform:translateY(70px);opacity:0} to{transform:none;opacity:1} }
  @keyframes vanish { 0%,30%{opacity:1} 100%{opacity:0} }
  @keyframes fall   { from{transform:translateY(-60px) rotate(0)} to{transform:translateY(1000px) rotate(360deg)} }
  @keyframes tilt   { 0%,100%{transform:rotate(-9deg)} 50%{transform:rotate(9deg)} }
  @keyframes flyin  { from{transform:translateX(-620px)} to{transform:none} }
  @keyframes walk   { from{transform:translateX(-260px)} to{transform:none} }

  .pulse{animation:pulse 3.2s ease-in-out infinite}
  .float{animation:float 5s ease-in-out infinite}
  .bob{animation:bob 1.6s ease-in-out infinite}
  .spin {transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
  .spinr{transform-box:fill-box;transform-origin:center;animation:spinr 22s linear infinite}
  .wave {transform-box:fill-box;transform-origin:left center;animation:wave 2.4s ease-in-out infinite}
  .flick{animation:flick 1.4s ease-in-out infinite}
  .tilt {transform-box:fill-box;transform-origin:center;animation:tilt 4s ease-in-out infinite}
  .petal{animation:fall 9s linear infinite}

  .scene .pop1,.scene .pop2,.scene .pop3,.scene .rise,.scene .flyin,.scene .walk { opacity:0 }
  .scene.active .pop1{animation:pop .9s .3s forwards}
  .scene.active .pop2{animation:pop .9s 1.4s forwards}
  .scene.active .pop3{animation:pop .9s 2.5s forwards}
  .scene.active .rise{animation:riseUp 1.4s .1s forwards}
  .scene.active .flyin{animation:flyin 1.1s .2s cubic-bezier(.2,.8,.2,1) forwards; opacity:1}
  .scene.active .walk{animation:walk 3.5s .1s ease-out forwards; opacity:1}
  .scene.active .vanish{animation:vanish 3.2s forwards}

  body.still .scene .pop1, body.still .scene .pop2, body.still .scene .pop3, body.still .scene .rise,
  body.still .scene .flyin, body.still .scene .walk { opacity:1; animation:none !important; transform:none }
  body.still .vanish { opacity:.35; animation:none !important }

  #caption { position:absolute; left:0; right:0; top:790px; text-align:center; padding:0 24px; box-sizing:border-box; min-height:90px;
             font-weight:800; font-size:36px; line-height:1.3; color:#f1e6c8;
             text-shadow:0 2px 3px #000, 0 0 12px rgba(0,0,0,.95); }
  #caption .w { display:inline-block; margin:0 5px; opacity:.82; transition:color .1s, transform .1s; }
  #caption .w.on { color:#ffd25e; opacity:1; transform:scale(1.1); text-shadow:0 0 16px rgba(255,200,80,.8), 0 2px 3px #000; }
  #caption .w.hl.on { color:#ff9d3c; }
  #shade { position:absolute; left:0; right:0; bottom:0; height:260px; pointer-events:none; background:linear-gradient(transparent, rgba(0,0,0,.72)); }
  #vig { position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse at 50% 40%, transparent 48%, rgba(0,0,0,.5) 100%); }
  #bar { position:absolute; left:0; bottom:0; height:4px; background:#e0453a; width:0; }
  #ui { position:fixed; top:10px; left:10px; z-index:10; display:flex; gap:8px; }
  #ui button { background:#222c; color:#fff; border:1px solid #555; border-radius:6px; padding:6px 12px; cursor:pointer; font:14px sans-serif; }
  body.clean #ui, body.clean #bar { display:none; }
</style>
</head>
<body>
<div id="ui"><button id="restart">Restart</button><button id="toggle">Pause</button></div>
<div id="wrap"><div id="stage">
  <div id="scenes"></div>
  <canvas id="dust" width="540" height="960"></canvas>
  <div id="shade"></div>
  <div id="vig"></div>
  <div id="caption"></div>
  <div id="bar"></div>
</div></div>

<script>
(function(){
/* =====================================================================
   SCRIPT: one entry = one shot.  Edit text / art / cam freely.
   After you have the voiceover: set audioSrc and (optionally) add a real
   `dur` (seconds) to each shot so it matches the narration.
   ===================================================================== */
const audioSrc = null; // e.g. "voice.mp3"
const SCENES = [
 { art:"warWide",  cam:"in",   text:"कुरुक्षेत्र का युद्ध 18 दिन चला..." },
 { art:"rider",    cam:"out",  text:"पर कहते हैं, एक योद्धा उसे सिर्फ 1 मिनट में खत्म कर सकता था!" },
 { art:"question", cam:"in",   text:"फिर वह लड़ा क्यों नहीं?" },
 { art:"hands",    cam:"out",  text:"जवाब एक दान में छिपा है..." },
 { art:"orb",      cam:"in",   text:"जिसके पास सबसे बड़ी जीत थी, उसने वही जीत दान कर दी!" },
 { art:"name",     cam:"in",   text:"नाम था — बारबरीक," },
 { art:"family",   cam:"panL", text:"घटोत्कच का बेटा, भीम का पोता।" },
 { art:"scroll",   cam:"in",   text:"स्कंद पुराण की परंपरा कहती है —" },
 { art:"devi",     cam:"out",  text:"देवी से उसे तीन अचूक बाण मिले।" },
 { art:"arrow1",   cam:"panR", text:"पहला बाण निशान लगाता," },
 { art:"arrow2",   cam:"panL", text:"दूसरा बाण बचाने वालों को चुनता," },
 { art:"arrow3",   cam:"in",   text:"और तीसरा निशान वालों को मिटा देता!" },
 { art:"mother",   cam:"in",   text:"वह मां को वचन दे चुका था: 'मैं कमजोर पक्ष की तरफ से लड़ूंगा।'" },
 { art:"brahmin",  cam:"panR", text:"युद्ध से पहले ब्राह्मण के वेश में कृष्ण उसके पास आए" },
 { art:"tree",     cam:"out",  text:"और बोले — 'इस पीपल के सारे पत्ते एक बाण से बींधो!'" },
 { art:"pierce",   cam:"panL", text:"बाण ने हर पत्ता बींध दिया," },
 { art:"foot",     cam:"in",   text:"पर एक पत्ता कृष्ण ने पैर के नीचे छुपा लिया था... और बाण उसी के चारों ओर घूमने लगा!" },
 { art:"scales",   cam:"out",  text:"कृष्ण समझ गए — कमजोर का साथ देने वाला कभी इधर जाएगा, कभी उधर!" },
 { art:"reveal",   cam:"in",   text:"तब कृष्ण ने दान में मांगा — 'तुम्हारा शिर!'" },
 { art:"yes",      cam:"in",   text:"बारबरीक ने बिना झिझके हां कह दिया," },
 { art:"headHill", cam:"out",  text:"और बस इतना मांगा कि वह युद्ध देख सके।" },
 { art:"pandavas", cam:"panR", text:"युद्ध खत्म हुआ तो पांडव जीत का श्रेय लेने लगे।" },
 { art:"chakra",   cam:"in",   text:"शिर ने कहा — 'मैंने बस कृष्ण का चक्र देखा!'" },
 { art:"bless",    cam:"in",   text:"तब कृष्ण ने वरदान दिया — 'कलयुग में तुम मेरे ही नाम से पूजे जाओगे!'" },
 { art:"shyam",    cam:"out",  text:"आज वही खाटू श्याम कहलाते हैं।" }
];
const HIGHLIGHT = ["बारबरीक","कृष्ण","खाटू","श्याम","बाण","शिर","चक्र","दान","भीम","घटोत्कच"];
const CHARS_PER_SEC = 13;   // narration speed estimate (Hindi). Higher = faster.
const PAUSE = 0.25;         // gap after each shot (seconds)
const FADE = 0.4;           // cross-fade length

/* ============================ ART HELPERS ============================ */
let UID = 0;
const grad = (id,a,b)=>'<linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+a+'"/><stop offset="1" stop-color="'+b+'"/></linearGradient>';
const radial = (id,c)=>'<radialGradient id="'+id+'"><stop offset="0" stop-color="'+c+'" stop-opacity=".95"/><stop offset="1" stop-color="'+c+'" stop-opacity="0"/></radialGradient>';
const DEFS = '<defs>'+grad('gold','#f8dc78','#cf9a2e')+radial('gl','#ffd36b')+radial('glr','#ff5a3c')+radial('glb','#6fb6ff')+radial('glg','#5cff9a')+radial('glw','#fff3d0')+
  '<filter id="b4"><feGaussianBlur stdDeviation="4"/></filter><filter id="b8"><feGaussianBlur stdDeviation="8"/></filter><filter id="b16"><feGaussianBlur stdDeviation="16"/></filter></defs>';
function sky(a,b){ const id='sk'+(UID++); return '<defs>'+grad(id,a,b)+'</defs><rect width="540" height="960" fill="url(#'+id+')"/>'; }
const glow=(cx,cy,r,id,op)=>'<circle class="pulse" cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="url(#'+id+')" opacity="'+(op||.6)+'" filter="url(#b16)"/>';
const ring=(cx,cy,r,o)=>'<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#f0d79a" stroke-opacity="'+(o||.4)+'" stroke-width="1.5"/>';
const txt=(x,y,size,fill,s,cls)=>'<g class="'+(cls||'')+'"><text x="'+x+'" y="'+y+'" text-anchor="middle" font-size="'+size+'" font-weight="800" fill="'+fill+'" style="filter:drop-shadow(0 0 10px '+fill+')">'+s+'</text></g>';
function mount(col,y,seed,amp){ let d='M0 960 L0 '+y; for(let i=0;i<=9;i++){ d+=' L'+(i*60)+' '+(y-((i*53+seed*31)%7)*(amp||14)); } return '<path d="'+d+' L540 960Z" fill="'+col+'"/>'; }
function ground(col,y){ return '<path d="M0 '+y+' Q270 '+(y-40)+' 540 '+y+' L540 960 L0 960Z" fill="'+col+'"/>'; }
const spin = (dur,body,cx,cy)=>'<g><animateTransform attributeName="transform" type="rotate" from="0 '+(cx||0)+' '+(cy||0)+'" to="360 '+(cx||0)+' '+(cy||0)+'" dur="'+dur+'s" repeatCount="indefinite"/>'+body+'</g>';
function sol(x,y,s,c,spear){ return '<g transform="translate('+x+' '+y+') scale('+s+')" fill="'+c+'"><circle cx="0" cy="-34" r="6"/><path d="M-7 -28 L7 -28 L9 0 L-9 0Z"/>'+(spear?'<line x1="12" y1="2" x2="12" y2="-60" stroke="'+c+'" stroke-width="2"/><path d="M9 -60 L12 -70 L15 -60Z"/>':'')+'</g>'; }
function arrow(x,y,len,ang,col,glw){
  return '<g transform="translate('+x+' '+y+') rotate('+ang+')">'+
    (glw?'<line x1="0" y1="0" x2="'+len+'" y2="0" stroke="'+col+'" stroke-width="12" opacity=".4" filter="url(#b8)"/>':'')+
    '<line x1="0" y1="0" x2="'+len+'" y2="0" stroke="'+col+'" stroke-width="3.5" stroke-linecap="round"/>'+
    '<polygon points="'+len+',-9 '+(len+24)+',0 '+len+',9" fill="'+col+'"/>'+
    '<polygon points="0,0 -16,-9 -7,0 -16,9" fill="'+col+'" opacity=".85"/></g>';
}
function leaf(x,y,rot,sc,col,op){ return '<path transform="translate('+x.toFixed(1)+' '+y.toFixed(1)+') rotate('+rot+') scale('+sc+')" d="M0 -12 Q10 -2 0 14 Q-10 -2 0 -12Z" fill="'+col+'" opacity="'+op+'"/>'; }
function leaves(cx,cy,n,sx,sy,hitEvery){ let s=''; for(let i=0;i<n;i++){ const a=i*2.399, r=Math.sqrt(i)*18; const hit=hitEvery&&(i%hitEvery===0); s+=leaf(cx+Math.cos(a)*r*sx, cy+Math.sin(a)*r*sy, (i*47)%360, 1, hit?'#c8ee7c':'#4d8a3a', hit?.98:.88); } return s; }

/* ---------- HEAD: one flexible face used for every character ---------- */
function head(o){
  o=Object.assign({skin:'#8c6a55',shade:'#6c4d3d',hair:'#0c0b10',crown:'mukut',mustache:false,brow:6,smile:0.3,closed:false,beard:null,bindi:true,bald:false,feather:false,bun:false,eyeGlow:false,gem:'#d63a2a',veil:null,earring:true,tilak:false},o||{});
  let s='';
  if(o.veil) s+='<path d="M-64 -20 Q-64 -108 0 -112 Q64 -108 64 -20 Q80 100 58 180 L-58 180 Q-80 100 -64 -20Z" fill="'+o.veil+'"/>';
  else if(!o.bald && !o.bun) s+='<path d="M-72 -20 Q-92 120 -58 195 L58 195 Q92 120 72 -20 Q62 -104 0 -104 Q-62 -104 -72 -20Z" fill="'+o.hair+'"/>';
  s+='<rect x="-19" y="55" width="38" height="70" fill="'+o.shade+'"/>';
  s+='<ellipse cx="-53" cy="8" rx="9" ry="16" fill="'+o.skin+'"/><ellipse cx="53" cy="8" rx="9" ry="16" fill="'+o.shade+'"/>';
  if(o.beard==='white') s+='<path d="M-52 38 Q-62 135 0 182 Q62 135 52 38 Q32 96 0 90 Q-32 96 -52 38Z" fill="#f4f1e8"/>';
  s+='<path d="M-52 -28 Q-55 62 0 94 Q55 62 52 -28 Q50 -80 0 -82 Q-50 -80 -52 -28Z" fill="'+o.skin+'"/>';
  s+='<path d="M0 -82 Q50 -80 52 -28 Q55 62 0 94Z" fill="'+o.shade+'" opacity=".55"/>';
  if(o.beard==='white') s+='<path d="M-40 52 Q0 74 40 52 Q0 66 -40 52Z" fill="#f4f1e8"/>';
  if(o.bun) s+='<path d="M-54 -30 Q-56 -96 0 -98 Q56 -96 54 -30 Q40 -66 0 -68 Q-40 -66 -54 -30Z" fill="'+o.hair+'"/><circle cx="0" cy="-108" r="22" fill="'+o.hair+'"/>';
  if(o.eyeGlow) s+='<ellipse cx="0" cy="0" rx="58" ry="22" fill="#ffcf6a" opacity=".28" filter="url(#b8)"/>';
  const eye=(m)=> o.closed
     ? '<path d="M'+(m*24-15)+' 0 Q'+(m*24)+' 10 '+(m*24+15)+' 0" stroke="#120a08" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
     : '<g transform="translate('+(m*24)+' 0)"><path d="M-15 1 Q0 -11 15 1 Q0 10 -15 1Z" fill="#f3e6c4"/><circle cx="0" cy="1" r="5.2" fill="#2a160c"/><circle cx="1.6" cy="-1" r="1.7" fill="#fff"/><path d="M-17 1 Q0 -14 17 1" stroke="#120a08" stroke-width="3.6" fill="none" stroke-linecap="round"/></g>';
  s+=eye(-1)+eye(1);
  s+='<path d="M-44 '+(-20-o.brow)+' L-9 -11" stroke="#0e0908" stroke-width="6" stroke-linecap="round"/><path d="M44 '+(-20-o.brow)+' L9 -11" stroke="#0e0908" stroke-width="6" stroke-linecap="round"/>';
  s+='<path d="M3 6 L-7 36 Q0 42 9 36" stroke="'+o.shade+'" stroke-width="3.5" fill="none" stroke-linecap="round"/>';
  if(o.mustache) s+='<path d="M-34 54 Q-16 44 0 51 Q16 44 34 54 Q16 58 0 55 Q-16 58 -34 54Z" fill="#0c0a0a"/>';
  s+='<path d="M-13 68 Q0 '+(68+o.smile*10)+' 13 68" stroke="#5a2424" stroke-width="3.5" fill="none" stroke-linecap="round"/>';
  if(o.bindi) s+='<ellipse cx="0" cy="-34" rx="4" ry="6" fill="#d02a22"/>';
  if(o.tilak) s+='<path d="M-24 -44 L24 -44 M-20 -52 L20 -52 M-16 -60 L16 -60" stroke="#f4f1e8" stroke-width="4" stroke-linecap="round"/>';
  if(o.earring) s+='<circle cx="-57" cy="30" r="8" fill="none" stroke="#e8b83a" stroke-width="4"/><circle cx="57" cy="30" r="8" fill="none" stroke="#e8b83a" stroke-width="4"/>';
  if(o.crown==='mukut'){
    s+='<path d="M-56 -46 L-48 -112 L-24 -90 L0 -140 L24 -90 L48 -112 L56 -46 Q0 -68 -56 -46Z" fill="url(#gold)"/>'+
       '<path d="M-56 -46 Q0 -68 56 -46 L56 -34 Q0 -56 -56 -34Z" fill="#b9801f"/>'+
       '<circle cx="0" cy="-58" r="12" fill="'+o.gem+'" opacity=".5" filter="url(#b4)"/><circle cx="0" cy="-58" r="7" fill="'+o.gem+'"/>'+
       '<path d="M-30 -80 Q-28 -100 -18 -96M30 -80 Q28 -100 18 -96" stroke="#fff3b0" stroke-width="2" fill="none" opacity=".7"/>';
  } else if(o.crown==='band'){
    s+='<path d="M-54 -46 Q0 -70 54 -46 L54 -34 Q0 -58 -54 -34Z" fill="url(#gold)"/><circle cx="0" cy="-56" r="6" fill="'+o.gem+'"/>';
  } else if(o.crown==='big'){
    s+='<path d="M-60 -44 L-58 -128 L-32 -100 L-14 -150 L0 -112 L14 -150 L32 -100 L58 -128 L60 -44 Q0 -68 -60 -44Z" fill="url(#gold)"/><circle cx="0" cy="-60" r="9" fill="'+o.gem+'"/><circle cx="-34" cy="-58" r="5" fill="#2ec28a"/><circle cx="34" cy="-58" r="5" fill="#2ec28a"/>';
  }
  if(o.feather) s+='<g transform="translate(0 -138) rotate(-8)"><path d="M0 0 Q-9 -44 0 -78" stroke="#3a7a4f" stroke-width="4" fill="none"/><ellipse cx="0" cy="-80" rx="13" ry="21" fill="#2e9a86"/><ellipse cx="0" cy="-80" rx="8" ry="14" fill="#1f5fb0"/><ellipse cx="0" cy="-80" rx="3.5" ry="7" fill="#e8c24a"/></g>';
  return s;
}
const HD = {
  barb:{skin:'#946e56',shade:'#6d4b3a',crown:'mukut',brow:7,smile:.2,eyeGlow:true},
  krish:{skin:'#4a69b0',shade:'#33508f',crown:'mukut',feather:true,brow:-4,smile:1.6,hair:'#0a0d1e',gem:'#e8c24a'},
  bhima:{skin:'#a67a5e',shade:'#7c553f',crown:'band',mustache:true,brow:10,smile:-.2,hair:'#14100e'},
  ghat:{skin:'#4d4a5c',shade:'#34323f',crown:'band',mustache:false,brow:12,smile:-.6,hair:'#0a0910',gem:'#c0392b'},
  devi:{skin:'#d9a07a',shade:'#b57a58',crown:'big',brow:-2,smile:1.2,hair:'#1a0f12',gem:'#d02a22',eyeGlow:true},
  mother:{skin:'#c58f6c',shade:'#9c6a4c',crown:'band',brow:-5,smile:.9,veil:'#c8641e',gem:'#d02a22'},
  brahmin:{skin:'#b98760',shade:'#8f6244',crown:'none',bun:true,hair:'#efece4',beard:'white',tilak:true,bindi:false,brow:-3,smile:.4,earring:false},
  pandava:{skin:'#b0805f',shade:'#85583f',crown:'band',brow:4,smile:1.2,hair:'#16100d'}
};

/* ---------- BODY / PERSON ---------- */
function body(o){
  o=Object.assign({cloth:'#7a1f1a',armor:'#1b2433',trim:'#d9a73a',skin:'#946e56',l:'down',r:'down',cape:null},o);
  const E={down:[80,-118],fold:[8,-178],up:[104,-352],out:[168,-250],hold:[96,-210]};
  const P=(m,p)=>{ const e=E[p]||E.down; const c={down:[92,-170],fold:[86,-165],up:[118,-270],out:[130,-232],hold:[112,-190]}[p]||[92,-170];
    return '<path d="M'+(m*68)+' -225 Q'+(m*c[0])+' '+c[1]+' '+(m*e[0])+' '+e[1]+'" stroke="'+o.skin+'" stroke-width="24" fill="none" stroke-linecap="round"/>'+
           '<path d="M'+(m*c[0]*.93)+' '+(c[1]+10)+' L'+(m*e[0])+' '+e[1]+'" stroke="'+o.trim+'" stroke-width="27" fill="none" opacity=".0"/>'+
           '<circle cx="'+(m*e[0])+'" cy="'+e[1]+'" r="13" fill="'+o.skin+'"/>'; };
  let s='';

/* ========================= BUILD SHOTS + TIMING ========================= */
const stage=document.getElementById('stage'), scenesEl=document.getElementById('scenes'), cap=document.getElementById('caption');
const strip = s => s.replace(/[.,!?'"‘’“”—\-…:।]/g,'');
// Shared gradients/filters live in one always-rendered SVG (hidden scenes can't host them)
const defsHost=document.createElement('div');
defsHost.style.cssText='position:absolute;width:0;height:0;overflow:hidden';
defsHost.innerHTML='<svg width="0" height="0" style="position:absolute">'+DEFS+'</svg>';
stage.insertBefore(defsHost, stage.firstChild);
let T=0;
SCENES.forEach((sc,i)=>{
  const words = sc.text.split(/\s+/).filter(w=>w && !/^[—\-]+$/.test(w));
  const weights = words.map(w=>strip(w).length+2);
  const total = weights.reduce((a,b)=>a+b,0);
  sc.start = T;
  sc.dur = sc.dur || Math.max(2.2, total/CHARS_PER_SEC + PAUSE);
  const speak = sc.dur - PAUSE; let acc=0;
  sc.words = words.map((w,k)=>{ const o={text:w, t:T + acc/total*speak}; acc+=weights[k]; return o; });
  sc.end = T + sc.dur; T = sc.end;
  const d=document.createElement('div'); d.className='scene';
  d.innerHTML='<svg viewBox="0 0 540 960">'+ART[sc.art]()+'</svg>'; scenesEl.appendChild(d); sc.el=d;
  sc.groups=[]; for(let k=0;k<sc.words.length;k+=4) sc.groups.push(sc.words.slice(k,k+4));
  sc.groupEls = sc.groups.map(g=>{
    const el=document.createElement('div'); el.style.display='none';
    g.forEach(w=>{ const s=document.createElement('span'); s.className='w'+(HIGHLIGHT.some(h=>strip(w.text).includes(h))?' hl':''); s.textContent=w.text; w.el=s; el.appendChild(s); });
    cap.appendChild(el); return el;
  });
});
const DURATION = T;

/* ============================== PLAYER ============================== */
function fit(){ stage.style.transform='scale('+Math.min(innerWidth/540, innerHeight/960)+')'; }
addEventListener('resize',fit); fit();

const cv=document.getElementById('dust'), cx=cv.getContext('2d');
const P=Array.from({length:70},()=>({x:Math.random()*540,y:Math.random()*960,r:Math.random()*1.6+.3,s:Math.random()*10+4,a:Math.random()*.6+.2,ph:Math.random()*6}));
function dust(t){ cx.clearRect(0,0,540,960); P.forEach(p=>{ const y=(p.y-t*p.s+9600)%960, x=p.x+Math.sin(t*.5+p.ph)*8; cx.globalAlpha=p.a*(.6+.4*Math.sin(t*2+p.ph)); cx.fillStyle='#ffe7b0'; cx.beginPath(); cx.arc(x,y,p.r,0,6.283); cx.fill(); }); }

function camTransform(cam,k){
  if(cam==='out')  return 'scale('+(1.12-0.12*k).toFixed(4)+')';
  if(cam==='panL') return 'scale(1.1) translateX('+(18-36*k).toFixed(2)+'px)';
  if(cam==='panR') return 'scale(1.1) translateX('+(-18+36*k).toFixed(2)+'px)';
  return 'scale('+(1+0.1*k).toFixed(4)+')';
}
function render(t){
  let activeIdx=-1;
  SCENES.forEach((sc,i)=>{
    let o=0;
    if (t>=sc.start-FADE && t<sc.end) o=Math.min(1,(t-(sc.start-FADE))/FADE);
    if (i===0 && t<FADE) o=1;
    sc.el.style.opacity=o.toFixed(3);
    const active = t>=sc.start && t<sc.end;
    if (active) activeIdx=i;
    sc.el.classList.toggle('active', active);
    const k=Math.max(0,Math.min(1,(t-sc.start)/sc.dur));
    sc.el.style.transform=camTransform(sc.cam,k);
    sc.el.style.zIndex = active ? 2 : 1;
    sc.el.style.display = (o>0 || active) ? 'block' : 'none';
  });
  SCENES.forEach((sc,i)=>{
    let ag=-1;
    if(i===activeIdx) sc.groups.forEach((g,gi)=>{ if(t>=g[0].t-0.05) ag=gi; });
    sc.groupEls.forEach((el,gi)=>el.style.display = gi===ag?'block':'none');
    if(ag>=0) sc.groups[ag].forEach(w=>w.el.classList.toggle('on', t>=w.t));
  });
  dust(t);
  document.getElementById('bar').style.width=(100*t/DURATION)+'%';
}

const qs=new URLSearchParams(location.search);
if(qs.has('clean')) document.body.classList.add('clean');
if(qs.has('notext')){ cap.style.display='none'; stage.querySelectorAll('.scene svg text').forEach(e=>e.style.display='none'); }
let fixed=null;
if(qs.has('shot')){ const sc=SCENES[+qs.get('shot')]; fixed = sc.start + Math.min(sc.dur*0.6, 4); }
else if(qs.has('t')) fixed=parseFloat(qs.get('t'));
if(fixed!==null) document.body.classList.add('still');
const audio = audioSrc ? new Audio(audioSrc) : null;
let t0=performance.now(), paused=false, pausedAt=0;
function now(){ if(fixed!==null) return fixed; if(paused) return pausedAt; const t=(performance.now()-t0)/1000; return t>=DURATION ? t%DURATION : t; }
let lastT=0;
function loop(){ const t=now(); if(audio && t<lastT){ audio.currentTime=0; audio.play().catch(()=>{}); } lastT=t; render(t); requestAnimationFrame(loop); }
loop();
document.getElementById('restart').onclick=()=>{ t0=performance.now(); paused=false; document.getElementById('toggle').textContent='Pause'; if(audio){audio.currentTime=0; audio.play().catch(()=>{});} };
document.getElementById('toggle').onclick=e=>{ if(!paused){pausedAt=now();paused=true;e.target.textContent='Play'; audio&&audio.pause();} else {t0=performance.now()-pausedAt*1000;paused=false;e.target.textContent='Pause'; audio&&audio.play().catch(()=>{});} };
})();
</script>
